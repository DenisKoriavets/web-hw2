<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик покупок</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="container">
    <!-- Left Panel -->
    <div class="panel left-panel">
        <div class="input-row">
            <input type="text" id="itemInput" placeholder="Назва товару">
            <button class="add-btn" id="addBtn" data-tooltip="Додати новий товар до списку">Додати</button>
        </div>

        <div id="itemsList"></div>
    </div>

    <!-- Right Panel -->
    <div class="panel right-panel">
        <div class="section">
            <h3>Залишилося</h3>
            <hr class="divider">
            <div id="remainingTags" class="tags"></div>
        </div>
        <hr class="divider">
        <div class="section">
            <h3>Куплено</h3>
            <hr class="divider">
            <div id="boughtTags" class="tags"></div>
        </div>
    </div>
</div>

<!-- BUY LIST BADGE -->
<div class="buy-badge">
    <div class="buy-badge-main">Buy List</div>
    <div class="buy-badge-extra">Created by:<br>Denis Koriavets</div>
</div>

<script src="script.js" defer></script>

</body>
</html>
